name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Force-pushes to feature branches cancel any in-flight run.
  # Main is excluded so every commit landing on main records a full
  # CI history (never cancelled by a subsequent commit).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Initialize EDK2
        run: git submodule update --init edk2
      - name: Install native build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-setuptools uuid-dev nasm acpica-tools gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none,aarch64-linux-android
      - name: Select Android NDK r27c
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build release firmware, recovery and host tools
        run: bash scripts/build.sh
      - name: Build debug firmware
        run: bash scripts/build-native.sh --debug --output dist/gbl-chainload-debug.efi
      - name: Smoke-test native host tool
        run: dist/host/gbl --help
      - uses: actions/upload-artifact@v4
        with:
          name: native-build
          path: |
            dist/gbl-chainload*.efi
            dist/recovery/gbl
            dist/recovery/SHA256SUMS
            dist/host/gbl
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - name: Cache cargo registry + git db
        # tests/runall.sh invokes `cargo build` for the gbl multicall and
        # crate parity tests. Caching the registry index + crate cache +
        # git db avoids re-downloading the dep graph on every run. NOT
        # caching target/ — workspace member sources change often and
        # target invalidation is finicky; registry is the slow part.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 python3-setuptools uuid-dev nasm acpica-tools gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu liblzma-dev shellcheck
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-none
      - name: Run all tests
        run: bash tests/runall.sh
