# /.cargo/config.toml — per-target linker config.
#
# Linkers are provided by the host toolchains:
#   - aarch64-linux-android: Android NDK clang (API 31 by default).
#   - aarch64-unknown-uefi:  rust-lld (bundled with rustc — no config).
#   - x86_64-pc-windows-gnu: mingw-w64 GCC (native cross-compiler). zig cc
#                            doesn't accept rustc's `--disable-auto-image-base`
#                            for this target.
#   - macOS:                native Apple clang, or local Zig wrappers generated
#                            by scripts/build-cross-tools.sh on Linux.
#   - linux-musl:           musl-gcc (musl-tools on Debian/Ubuntu).

[target.aarch64-linux-android]
linker = "aarch64-linux-android31-clang"

[target.aarch64-unknown-uefi]
# rust-lld is bundled with rustc; no extra config needed.

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"
